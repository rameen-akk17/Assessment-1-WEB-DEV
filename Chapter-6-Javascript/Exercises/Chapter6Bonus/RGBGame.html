<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="RGB.css">
    <title>RGB Color Game</title>
</head>
<body>

    <div class="difficulty-container"> <!-- lets player choose difficulty lvl (optional)-->
        <h3>Select Difficulty:</h3> 
        <button onclick="startGame('easy')">Easy</button>
        <button onclick="startGame('medium')">Medium</button>
        <button onclick="startGame('hard')">Hard</button>
    </div>

    <div class="game-container">
        <h2>Guess the RGB Color</h2>
        
        <!-- displays the rgb value to guess -->
        <p id="rgbValue"></p>

        <!-- container for color options -->
        <div id="colorOptions"></div>

        <!-- result message -->
        <p id="result"></p>

        <!-- replay button -->
        <button id="replay" onclick="startGame()">Play Again</button>
    </div>

<script src="game.js" type="text/javascript"></script>
</body>
</html>

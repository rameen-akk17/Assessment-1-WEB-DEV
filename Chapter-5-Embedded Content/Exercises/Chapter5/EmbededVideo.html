<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Video.css">
    <title>Minecraft Video</title>
</head>
<body>

    <div class="vid">   <!-- a container div for styling and centering the video -->
        <video controls autoplay loop poster="MC.png">
            <!-- video element to embed a video file -->
            <!-- controls adds play, pause, volume, and fullscreen options -->
            <!-- autoplay makes the video play automatically -->
            <!-- loop makes the video restart after finishing -->
            <!-- poster sets an image to show before the video plays -->
            <source src="MCVideo.mp4" type="video/mp4">
            your browser does not support the video tag.
            <!-- error message if the browser doesn't support the video element -->
        </video>
    </div>

</body>
</html>
